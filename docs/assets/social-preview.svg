<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="50%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#181e29"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c68c4c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c68c4c" stop-opacity="0"/>
    </radialGradient>
    <g id="mark">
      <path fill="#b07c42" d="M14,13 C27,19 42,29 50,37 C42,45 33,49 27,49 C18,42 13,26 14,13 Z"/>
      <path fill="#b07c42" d="M86,13 C73,19 58,29 50,37 C58,45 67,49 73,49 C82,42 87,26 86,13 Z"/>
      <path fill="#6b4220" d="M20,21 C29,26 39,32 45,38 C39,43 33,45 29,44 C23,39 19,29 20,21 Z"/>
      <path fill="#6b4220" d="M80,21 C71,26 61,32 55,38 C61,43 67,45 71,44 C77,39 81,29 80,21 Z"/>
      <g fill="#efddb4">
        <ellipse cx="50" cy="75" rx="26" ry="12.5"/>
        <circle cx="30" cy="78" r="8.5"/>
        <circle cx="40" cy="82.5" r="8.5"/>
        <circle cx="50" cy="83.5" r="8.5"/>
        <circle cx="60" cy="82.5" r="8.5"/>
        <circle cx="70" cy="78" r="8.5"/>
      </g>
      <ellipse fill="#c68c4c" cx="50" cy="55" rx="25" ry="23"/>
      <ellipse fill="#2e1d0f" cx="38.5" cy="55" rx="6.2" ry="7.2"/>
      <ellipse fill="#2e1d0f" cx="61.5" cy="55" rx="6.2" ry="7.2"/>
      <circle fill="#fff" cx="40.6" cy="52.2" r="2.2"/>
      <circle fill="#fff" cx="63.6" cy="52.2" r="2.2"/>
      <path fill="#2e1d0f" d="M50,64 C48.3,64 46.4,62.4 46.4,61.1 C46.4,60.1 48.1,59.8 50,59.8 C51.9,59.8 53.6,60.1 53.6,61.1 C53.6,62.4 51.7,64 50,64 Z"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="640" cy="250" r="300" fill="url(#glow)"/>

  <!-- Centred stack. A symmetric lockup survives being shrunk to a link
       thumbnail far better than a left-aligned one with a ragged right edge. -->
  <use href="#mark" transform="translate(532.5,92) scale(2.15)"/>

  <text x="640" y="378" text-anchor="middle" font-family="Ubuntu, DejaVu Sans, sans-serif"
        font-size="96" font-weight="700" fill="#e7ebf2" letter-spacing="-2.5">Peevee</text>

  <text x="640" y="430" text-anchor="middle" font-family="Ubuntu, DejaVu Sans, sans-serif"
        font-size="30" fill="#98a2b3">PVC usage across every cluster you operate</text>

  <!-- Usage bars: green, amber, red. No labels — they are unreadable once the
       card is scaled down, and the fill levels already say it. -->
  <g transform="translate(454,494)">
    <rect x="0"   y="0" width="112" height="10" rx="5" fill="#222a36"/>
    <rect x="0"   y="0" width="35"  height="10" rx="5" fill="#35c48d"/>
    <rect x="130" y="0" width="112" height="10" rx="5" fill="#222a36"/>
    <rect x="130" y="0" width="88"  height="10" rx="5" fill="#e0a136"/>
    <rect x="260" y="0" width="112" height="10" rx="5" fill="#222a36"/>
    <rect x="260" y="0" width="106" height="10" rx="5" fill="#f2635e"/>
  </g>
</svg>
