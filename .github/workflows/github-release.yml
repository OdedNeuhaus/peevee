name: github-release

# Cuts the GitHub Release for a tag. Separate from release.yml, which publishes
# the container image: the image is the artifact, this is the announcement, and
# a failure in one should not hold back the other.
#
# workflow_dispatch exists so a tag that was pushed before this workflow existed
# can still get its release, without deleting and re-pushing the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: t
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
          # Release notes are generated by diffing against the previous tag, so
          # a shallow clone would produce an empty changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binaries
        env:
          TAG: ${{ steps.t.outputs.tag }}
          VERSION: ${{ steps.t.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X github.com/OdedNeuhaus/peevee/internal/version.Version=${VERSION} \
            -X github.com/OdedNeuhaus/peevee/internal/version.Commit=${COMMIT} \
            -X github.com/OdedNeuhaus/peevee/internal/version.Date=${DATE}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}; GOARCH=${target#*/}
            echo "building ${GOOS}/${GOARCH}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath -ldflags="$LDFLAGS" -o "peevee" ./cmd/peevee
            tar -czf "dist/peevee_${VERSION}_${GOOS}_${GOARCH}.tar.gz" peevee LICENSE README.md
            rm -f peevee
          done
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
          ls -lh dist

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
          VERSION: ${{ steps.t.outputs.version }}
        run: |
          set -euo pipefail
          # Ask the API for the changelog rather than passing --generate-notes,
          # so the preamble below is guaranteed to come first.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md || echo "" > generated.md
          {
            echo "## Container image"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/odedneuhaus/peevee:${VERSION}"
            echo '```'
            echo
            echo "Multi-arch: \`linux/amd64\`, \`linux/arm64\`."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "helm install peevee ./charts/peevee \\"
            echo "  --namespace peevee --create-namespace \\"
            echo "  --set config.discovery.inClusterFallback=true"
            echo '```'
            echo
            echo "Binaries below are for running Peevee outside a cluster against"
            echo "your own kubeconfig. Verify them with \`sha256sum -c SHA256SUMS\`."
            echo
            cat generated.md
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          # Re-running for a tag that already has a release should update it
          # rather than fail the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Peevee $TAG"
          else
            gh release create "$TAG" dist/* \
              --title "Peevee $TAG" \
              --notes-file notes.md \
              --verify-tag
          fi
          gh release view "$TAG" --json url --jq .url
